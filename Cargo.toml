[workspace]
resolver = "2"
members = ["contracts/phalanx-core", "contracts/phalanx-sandbox-tests"]
# `cargo test` at the root runs the fast, hermetic unit tests only.
# The near-workspaces sandbox suite is opt-in: `cargo test -p phalanx-sandbox-tests`.
default-members = ["contracts/phalanx-core"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"

# Size/safety profile used for the on-chain WASM build (mirrors cargo-near defaults).
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

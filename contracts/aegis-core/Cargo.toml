[package]
name = "aegis-core"
version = "0.1.0"
description = "PhalanxSwarm core contract: policy-enforced agent treasury, swarm bidding market, TEE-verified escrow and NEAR Intents / Chain Signatures settlement"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }
